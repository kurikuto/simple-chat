<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket チャットアプリ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 600px;
      height: 80vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px 10px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      font-size: 24px;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4444;
      animation: pulse 2s infinite;
    }
    
    .status-indicator.connected {
      background: #44ff44;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f5f5f5;
    }
    
    .message {
      margin-bottom: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .message.chat {
      background: white;
      border-left: 4px solid #667eea;
    }
    
    .message.system {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      font-style: italic;
      color: #555;
    }
    
    .message .timestamp {
      font-size: 11px;
      color: #999;
      margin-top: 5px;
    }
    
    .message .client-count {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin-left: 8px;
    }
    
    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #eee;
      border-radius: 0 0 10px 10px;
    }
    
    .input-group {
      display: flex;
      gap: 10px;
    }
    
    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #eee;
      border-radius: 25px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    #messageInput:focus {
      outline: none;
      border-color: #667eea;
    }
    
    #sendButton {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    #sendButton:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    #sendButton:active {
      transform: translateY(0);
    }
    
    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    
    .btn {
      padding: 8px 16px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 15px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .btn:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💬 WebSocket チャット</h1>
      <div class="status">
        <div id="statusIndicator" class="status-indicator"></div>
        <span id="statusText">接続中...</span>
      </div>
    </div>
    
    <div id="messages" class="messages">
      <!-- メッセージがここに表示されます -->
    </div>
    
    <div class="input-area">
      <div class="input-group">
        <input 
          type="text" 
          id="messageInput" 
          placeholder="メッセージを入力..." 
          disabled
        />
        <button id="sendButton" disabled>送信</button>
      </div>
      <div class="controls">
        <button id="clearButton" class="btn">チャットをクリア</button>
        <button id="pingButton" class="btn">接続テスト (Ping)</button>
      </div>
    </div>
  </div>
  
  <script src="/dist/client.js"></script>
</body>
</html>
